<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">JackarooArena: a screaming player holds up the marble his calm, smug opponent just killed</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#7a3a16"/>
      <stop offset="0.6" stop-color="#3a1a0a"/>
      <stop offset="1" stop-color="#160903"/>
    </radialGradient>
    <radialGradient id="marble" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ff8a7a"/>
      <stop offset="0.45" stop-color="#d63a3a"/>
      <stop offset="1" stop-color="#6e1010"/>
    </radialGradient>
    <pattern id="shemagh" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#efe6d8"/>
      <rect width="3" height="14" fill="#b3242a"/>
      <rect width="14" height="3" fill="#b3242a"/>
      <rect x="7" y="7" width="2.5" height="2.5" fill="#b3242a"/>
    </pattern>
  </defs>

  <!-- The majlis behind them: warm glow, a pointed arch, a star -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M146 430 V170 Q146 60 256 20 Q366 60 366 170 V430 Z" fill="#000" opacity="0.22"/>
  <g fill="#d9a441" opacity="0.35" transform="translate(256 52)">
    <rect x="-9" y="-9" width="18" height="18"/>
    <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)"/>
  </g>

  <!-- LEFT: the screaming one, in a shemagh, facing right -->
  <g stroke="#2a1206" stroke-width="4" stroke-linejoin="round">
    <!-- arm, behind his head -->
    <path d="M96 512 L92 400 L186 150 L262 104 L296 122 L224 178 L150 420 L160 512 Z" fill="#b57c52"/>
    <!-- shemagh over the head and down the back -->
    <path d="M60 420 L48 250 Q50 120 150 92 Q215 82 238 132 L170 150 L128 270 L118 420 Z" fill="url(#shemagh)"/>
    <!-- face and stretched jaw -->
    <path d="M150 130 L232 132 L246 160 L274 184 L262 200 L270 214 L296 226
             L292 250 L262 238 L270 300 L288 350 L262 378 L212 392 L166 386 L140 330 L128 250 Z" fill="#c68a5e"/>
    <!-- open mouth -->
    <path d="M270 214 L300 228 L306 262 L298 330 L288 350 L266 340 L258 290 L262 238 Z" fill="#5a0d10"/>
    <path d="M266 318 Q284 300 300 318 L298 334 L272 342 Z" fill="#d9636b" stroke-width="3"/>
    <!-- big blocky teeth, top and bottom -->
    <g fill="#f8f1e2" stroke-width="3">
      <rect x="268" y="222" width="12" height="16" rx="2"/>
      <rect x="281" y="226" width="12" height="17" rx="2"/>
      <rect x="294" y="230" width="10" height="15" rx="2"/>
      <rect x="262" y="330" width="12" height="15" rx="2" transform="rotate(-8 268 337)"/>
      <rect x="276" y="331" width="12" height="15" rx="2" transform="rotate(-8 282 338)"/>
    </g>
    <!-- low-poly facets: lit cheek, shadowed jaw -->
    <path d="M172 160 L228 166 L214 220 L168 228 Z" fill="#dca077" stroke="none"/>
    <path d="M150 300 L240 318 L262 378 L212 392 L166 386 Z" fill="#a8714a" stroke="none"/>
    <!-- bulging eye with a tiny red iris, furious brow -->
    <circle cx="214" cy="170" r="25" fill="#fff"/>
    <circle cx="226" cy="166" r="7" fill="#d63a3a" stroke-width="3"/>
    <circle cx="227" cy="166" r="2.5" fill="#1b1410" stroke="none"/>
    <path d="M176 140 L250 150 L252 160 L180 152 Z" fill="#1c120c" stroke-width="3"/>
    <!-- black agal on the shemagh -->
    <path d="M70 160 Q120 112 196 112" fill="none" stroke="#111" stroke-width="10"/>
    <!-- rage wrinkles -->
    <g fill="none" stroke="#7a4a2a" stroke-width="3">
      <path d="M186 250 Q206 262 222 250"/>
      <path d="M180 272 Q204 286 226 274"/>
      <path d="M172 320 Q196 334 220 322"/>
      <path d="M168 346 Q194 360 222 348"/>
    </g>
    <!-- hand raised over his head, holding up the marble that just got killed -->
    <path d="M254 140 Q250 108 270 100 L304 100 Q318 108 312 128 L304 146 L262 150 Z" fill="#c68a5e"/>
    <circle cx="284" cy="78" r="30" fill="url(#marble)"/>
    <path d="M262 84 Q276 64 292 80 Q304 94 310 74" fill="none" stroke="#ffe9e0" stroke-width="5" opacity="0.8"/>
    <path d="M258 116 L268 96 M276 116 L282 94 M294 116 L296 94" fill="none" stroke-width="3"/>
  </g>

  <!-- RIGHT: the calm one, hair and beard, smug, facing left -->
  <g stroke="#2a1206" stroke-width="4" stroke-linejoin="round" transform="translate(26 0)">
    <!-- head and neck -->
    <path d="M330 120 Q380 86 440 104 Q494 128 492 210 Q488 280 450 320 L470 512 L360 512 L362 330
             L340 300 L330 270 L318 262 L322 244 L312 236 L316 222 L304 210 L312 200 L300 186 L318 162 Z" fill="#a8714a"/>
    <path d="M330 150 L380 160 L372 210 L326 212 Z" fill="#bb8358" stroke="none"/>
    <!-- hair cap and back -->
    <path d="M326 124 Q380 80 446 100 Q500 126 494 210 L470 236 Q470 160 420 140 Q380 132 336 150 Z" fill="#1c120c"/>
    <!-- ear -->
    <path d="M430 178 Q452 172 452 200 Q450 224 430 222 Z" fill="#9a6440"/>
    <!-- trimmed beard along the jaw -->
    <path d="M316 222 L340 232 L380 240 L430 236 L452 260 L440 300 L400 318 L362 314 L338 296 L324 268 L318 254 Z" fill="#1c120c"/>
    <!-- smug smirk -->
    <path d="M314 234 Q326 242 344 232" fill="none" stroke="#f0d2b4" stroke-width="3"/>
    <!-- half-closed, satisfied eye and a raised brow -->
    <path d="M332 170 Q346 160 360 170 Q346 176 332 170 Z" fill="#fff" stroke-width="3"/>
    <path d="M332 170 Q346 162 360 170" fill="none" stroke-width="5"/>
    <path d="M326 148 Q348 134 372 146" fill="none" stroke="#1c120c" stroke-width="7"/>
    <!-- hand under the chin, holding his cards -->
    <g stroke-width="3">
      <rect x="290" y="300" width="40" height="56" rx="4" fill="#f4ead6" transform="rotate(-18 310 328)"/>
      <rect x="306" y="294" width="40" height="56" rx="4" fill="#f4ead6" transform="rotate(-4 326 322)"/>
      <rect x="322" y="296" width="40" height="56" rx="4" fill="#f4ead6" transform="rotate(10 342 324)"/>
      <text x="330" y="322" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#c0221f" stroke="none" transform="rotate(10 342 324)">K</text>
      <text x="314" y="318" font-family="Georgia, serif" font-size="20" fill="#1b1410" stroke="none" transform="rotate(-4 326 322)">&#9824;</text>
    </g>
    <path d="M300 340 Q296 318 318 314 L362 318 Q380 324 376 346 L364 380 L380 512 L320 512 L318 384 Z" fill="#a8714a"/>
    <path d="M308 330 L344 334 M306 346 L342 350" fill="none" stroke-width="3"/>
  </g>

  <!-- Title -->
  <text x="256" y="486" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-size="54"
        font-weight="900" fill="#f2c14e" stroke="#2a1206" stroke-width="10" paint-order="stroke"
        letter-spacing="-1">JackarooArena</text>
</svg>
