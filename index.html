<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JackarooArena</title>
    <meta
      name="description"
      content="Online Jackaroo for 4 friends: 2 vs 2 in a cosy 3D majlis. Free in your browser, no account."
    />
    <meta name="theme-color" content="#1a0f08" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JackarooArena" />
    <meta
      property="og:description"
      content="Online Jackaroo for 4 friends: 2 vs 2 in a cosy 3D majlis. Free in your browser, no account."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-label="JackarooArena game table"></canvas>
    <p id="status" role="status">Connecting...</p>
    <main id="lobby"></main>
    <section id="game" hidden>
      <p id="turn" role="status"></p>
      <button type="button" id="rematch" hidden>Rematch</button>
    </section>
    <button type="button" id="mute">Sound: on (M)</button>
    <button type="button" id="taunt">Taunt (T)</button>
    <div id="taunts" hidden aria-label="Taunts"></div>
    <div id="choices" hidden aria-label="Your options"></div>
    <footer id="disclaimer">
      All characters are made up. Any resemblance to real people is a coincidence.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
